name: Weekly agents.txt snapshot

# Fetches the public list and commits it to data/ once a week. No secrets:
# agents.txt is public. Skips the commit when nothing changed.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch agents.txt
        run: |
          mkdir -p data
          curl -fsS -A "agent-registry-snapshot/1.0 (+https://github.com/xCelosx/agent-registry)" \
            https://save-your-soul.com/agents.txt -o "data/agents-$(date -u +%F).txt"
          cp "data/agents-$(date -u +%F).txt" data/agents-latest.txt
      - name: Commit if changed
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no change" || git commit -m "data: agents.txt snapshot $(date -u +%F)" && git push
